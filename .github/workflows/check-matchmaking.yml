name: Check matchmaking status

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-matchmaking.yml"
      - "scripts/**"
      - "test/**"
      - "package.json"
      - "index.html"
      - ".nojekyll"
      - "status.json"
  schedule:
    # Every 30 minutes, offset from the top of the hour to avoid peak scheduler load.
    - cron: "17,47 * * * *"
  workflow_dispatch:
  # Reserved for a trusted relay (never call this directly from browser JavaScript).
  repository_dispatch:
    types: [matchmaking-alert]

concurrency:
  group: service-status-matchmaking
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

env:
  MATCHMAKING_HEALTH_URL: https://kanji-crash-match-server.rikai-829.workers.dev/health/deep
  MATCHMAKING_EXPECTED_ORIGIN: https://yu-zora.com
  SERVICE_KEY: cloudflare-matchmaking

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test monitor
        run: npm test

      - name: Probe matchmaking Worker
        id: probe
        run: node scripts/check-matchmaking.mjs

      - name: Commit status change
        if: ${{ steps.probe.outputs.status_changed == 'true' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          git commit -m "chore(status): update matchmaking status"
          git push

      - name: Prepare Pages artifact
        if: ${{ steps.probe.outputs.probed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'repository_dispatch' }}
        shell: bash
        run: |
          mkdir -p _site
          cp status.json index.html .nojekyll _site/

      - name: Configure GitHub Pages
        if: ${{ steps.probe.outputs.probed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'repository_dispatch' }}
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: ${{ steps.probe.outputs.probed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'repository_dispatch' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        if: ${{ steps.probe.outputs.probed == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event_name == 'repository_dispatch' }}
        id: deployment
        uses: actions/deploy-pages@v4
